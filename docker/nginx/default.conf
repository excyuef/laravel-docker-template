server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/html/public;
    index index.php;

    # Charset
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide Nginx version
    server_tokens off;

    # Max body size - match PHP upload_max_filesize
    client_max_body_size 64M;

    # Buffer tuning
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;

    # Logging
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---------------------------------------------------------------------------
    # Static assets - served directly by Nginx, no PHP needed
    # ---------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Laravel entry point
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # PHP-FPM passthrough
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        # Only allow .php files that exist
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  laravel-php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;

        # Buffer tuning
        fastcgi_buffer_size          128k;
        fastcgi_buffers              8 256k;
        fastcgi_busy_buffers_size    256k;
    }

    # ---------------------------------------------------------------------------
    # Block access to hidden files (.env, .git, etc.)
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~* (\.env|composer\.(json|lock)|package\.json|webpack\.mix\.js)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (for load balancers / Docker healthcheck)
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
