[PHP]
; Error reporting (overridden per environment via env)
error_reporting = E_ALL
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_ERRORS}
log_errors = On
error_log = /dev/stderr

; Limits - tuned for 8GB RAM host
memory_limit = 256M
max_execution_time = 60

; Upload
upload_max_filesize = 64M
post_max_size = 64M

; Timezone
date.timezone = ${APP_TIMEZONE}

; Misc
expose_php = Off
short_open_tag = Off