[www]
; Run as the laravel user
user = laravel
group = laravel

; Listen on TCP socket for Nginx communication
listen = 0.0.0.0:9000
listen.owner = laravel
listen.group = laravel
listen.mode = 0660

; Process manager - dynamic is ideal for dev, consider static for high-load prod
pm = dynamic

; Max children = total RAM for PHP / memory per process
; 8GB host, containers share ~4GB → ~16 workers at 256MB each (conservative)
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Status page (useful for monitoring)
pm.status_path = /fpm-status

; Logging
access.log = /dev/null
slowlog = /dev/stderr
request_slowlog_timeout = 10s

; Environment variables passed to PHP workers
clear_env = no
