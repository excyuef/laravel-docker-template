# =============================================================================
# Docker Compose - Laravel 13 Development Environment
# =============================================================================
# Services:
#   laravel-nginx    → Nginx web server (port 8080)
#   laravel-php      → PHP-FPM 8.4 application server
#   laravel-mysql    → MySQL 8.4 database
#   laravel-redis    → Redis cache/queue/session
#   laravel-queue    → Laravel queue worker
#   laravel-scheduler → Laravel task scheduler (cron)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nginx: Web server & reverse proxy to PHP-FPM
  # Handles static files natively; passes .php requests to laravel-php
  # ---------------------------------------------------------------------------
  laravel-nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      # Application code (hot reload: Nginx sees file changes instantly)
      - ./:/var/www/html:ro
      # Custom Nginx configs
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      laravel-php:
        condition: service_healthy
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PHP-FPM: Application server
  # Runs PHP workers, executes Laravel application logic
  # ---------------------------------------------------------------------------
  laravel-php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: laravel-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Application code with write access (hot reload for PHP)
      - ./:/var/www/html
      # Composer cache persisted for faster installs
      - composer-cache:/home/laravel/.composer
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: laravel-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # Redis
      REDIS_HOST: laravel-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      # Cache, Session, Queue
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      # PHP behavior
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-1}
      OPCACHE_VALIDATE_TIMESTAMPS: ${OPCACHE_VALIDATE_TIMESTAMPS:-1}
    depends_on:
      laravel-mysql:
        condition: service_healthy
      laravel-redis:
        condition: service_healthy
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MySQL 8.4: Primary database
  # Stable LTS release; performance_schema disabled to reduce RAM usage
  # ---------------------------------------------------------------------------
  laravel-mysql:
    image: mysql:8.4
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Persistent data
      - mysql-data:/var/lib/mysql
      # Custom MySQL config
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # SQL seed files (executed on first init)
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Expose for external tools (TablePlus, DBeaver, etc.)
      - "${DOCKER_MYSQL_PORT:-3306}:3306"
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7: Cache, Session, Queue backend
  # Single instance; persists data to disk (RDB snapshot)
  # ---------------------------------------------------------------------------
  laravel-redis:
    image: redis:7.4-alpine
    container_name: laravel-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      # Expose for debugging with Redis CLI or RedisInsight
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Queue Worker: Processes background jobs
  # Restarts automatically on failure; separate from PHP-FPM for isolation
  # ---------------------------------------------------------------------------
  laravel-queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: laravel-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: laravel-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: laravel-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-1}
      OPCACHE_VALIDATE_TIMESTAMPS: ${OPCACHE_VALIDATE_TIMESTAMPS:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    depends_on:
      laravel-php:
        condition: service_healthy
      laravel-redis:
        condition: service_healthy
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # Scheduler: Runs Laravel's task scheduler every minute
  # Replaces traditional cron; uses the same image as PHP-FPM
  # ---------------------------------------------------------------------------
  laravel-scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # Loop every 60s and call schedule:run (simulates cron * * * * *)
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: laravel-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: laravel-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-1}
      OPCACHE_VALIDATE_TIMESTAMPS: ${OPCACHE_VALIDATE_TIMESTAMPS:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    depends_on:
      laravel-php:
        condition: service_healthy
    networks:
      - laravel-network

# =============================================================================
# Networks
# =============================================================================
networks:
  laravel-network:
    driver: bridge
    name: laravel-network

# =============================================================================
# Volumes (persistent storage across container restarts)
# =============================================================================
volumes:
  mysql-data:
    name: laravel-mysql-data
  redis-data:
    name: laravel-redis-data
  composer-cache:
    name: laravel-composer-cache
